<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Climate-REF" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climate-REF</title>
    <meta
      name="description"
      content="The dashboard for the CMIP7 Assessment Fast Track Rapid Evaluation Framework, providing visualisations for the output of all diagnostics that were run on the published CMIP6 and CMIP7 data. All data is also available via a public REST API at api.climate-ref.org (OpenAPI: https://api.climate-ref.org/api/v1/openapi.json)."
    />
    <!-- API discovery for crawlers and agents (RFC 8631) -->
    <link
      rel="service-desc"
      type="application/openapi+json"
      href="https://api.climate-ref.org/api/v1/openapi.json"
    />
    <link rel="service-doc" type="text/html" href="https://api.climate-ref.org/docs" />
    <link rel="api-catalog" href="/.well-known/api-catalog" />
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="Overview for LLMs" />
    <script>
      // Prevent initial theme flash by setting html.dark before React mounts
      (() => {
        try {
          const storageKey = "theme";
          const getStored = () => {
            try { return localStorage.getItem(storageKey); } catch { return null; }
          };
          const mql = window.matchMedia?.("(prefers-color-scheme: dark)");
          const systemPrefersDark = () => mql?.matches;
          const stored = getStored();
          const explicit = stored === "dark" || stored === "light";
          const shouldDark = explicit ? stored === "dark" : systemPrefersDark();
          if (shouldDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <h1>Climate-REF</h1>
      <p>
        This dashboard needs JavaScript to run. Please enable JavaScript in your browser to explore the
        results of the CMIP7 Assessment Fast Track Rapid Evaluation Framework.
      </p>
      <p>
        For programmatic access to the data, use the public REST API instead; see the
        <a href="https://api.climate-ref.org/docs">API documentation</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
